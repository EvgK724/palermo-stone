  <title id="title">Палермский камень — иконка приложения</title>
  <desc id="description">Оригинальная схематическая каменная пластина с неоновыми линиями. Короткие насечки обозначают мелкую резьбу; они не являются иероглифической надписью или её переводом.</desc>
